<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Invoice Haven Residence</title>
<style>
:root{--bg:#f6f4ef;--cd:#fff;--tx:#2b2e2c;--mu:#6b706b;--sg:#7d8f75;--gd:#b8975a;--bd:#e4e0d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1e1d;--cd:#2b2e2c;--tx:#f6f4ef;--mu:#a6aaa4;--bd:#3c403d;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1c1e1d;--cd:#2b2e2c;--tx:#f6f4ef;--mu:#a6aaa4;--bd:#3c403d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1100px;margin:auto;padding:14px}
header{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
header b{font:600 20px Georgia,serif;letter-spacing:.08em}header small{color:var(--gd);display:block;letter-spacing:.12em;font-size:11px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
nav button{flex:1;white-space:nowrap}
button,.b{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer}
button.on,.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
:root:not([data-theme=light]) button.on{color:#1c1e1d}
.gold{background:var(--gd);border-color:var(--gd);color:#fff}.sage{background:var(--sg);border-color:var(--sg);color:#fff}.red{color:#b3402f}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
h3{margin:0 0 10px;font:600 17px Georgia,serif}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{font-size:12px;color:var(--mu);display:block}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input:disabled{opacity:.6}
.stat{border-left:3px solid var(--gd)}.stat small{color:var(--mu);display:block}.stat b{font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bdg{padding:2px 10px;border-radius:99px;font-size:12px;background:var(--bd);white-space:nowrap}
.Lunas{background:#dfe9d9;color:#2f5a22}.Terlambat{background:#f4d9d3;color:#9b2f20}.Dibatalkan{background:#ddd;color:#555}.Draft{background:#efe6d2;color:#7a5f25}
.ov{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}th{color:var(--mu);font-weight:500;font-size:12px}td.r,th.r{text-align:right}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px}.bars div{flex:1;text-align:center;font-size:10px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;background:var(--sg);border-radius:4px 4px 0 0;min-height:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);overflow:auto;padding:14px;display:none;z-index:9}
.mw{max-width:760px;margin:auto}
.sheet{background:#fff;color:#2b2e2c;border-radius:12px;padding:26px;border-top:6px solid #b8975a}
.sheet td,.sheet th{border-color:#e4e0d6;color:#2b2e2c}
.dh{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2b2e2c;color:#f6f4ef;padding:10px 16px;border-radius:12px;display:none;z-index:20;max-width:90%}
#sg{width:100%;height:auto;background:#fff;border:1px dashed var(--gd);border-radius:10px;touch-action:none;display:block}
@media print{.app,.noprint,#toast{display:none!important}.modal{position:static;background:#fff;padding:0;display:block!important}.sheet{border-radius:0}}
@media(max-width:560px){.two{grid-template-columns:1fr}}

const inc=S.inv.flatMap(v=>v.status==='Draft'||v.status==='Dibatalkan'?[]:v.pays.filter(x=>x.ok&&x.d.slice(0,7)===em)).reduce((a,x)=>a+x.amt,0);
return`<div class="card"><h3>Catat pengeluaran operasional</h3><div class="g"><div><label>Tanggal</label><input id="e-d" type="date" value="${td()}"></div><div><label>Kategori</label><select id="e-c" onchange="const f=FIX[this.value];if(f)$('#e-a').value=f">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Nominal (Rp)</label><input id="e-a" type="number" placeholder="0"></div><div><label>Catatan</label><input id="e-n" placeholder="mis. token listrik, tagihan PDAM"></div></div><p style="color:var(--mu);font-size:13px;margin:8px 0 0">Listrik kamar dibayar penyewa per meteran, jadi catat di sini hanya listrik area umum.</p><div class="row"><button class="pri" onclick="addExp()">Simpan pengeluaran</button><button onclick="fixExp()">Isi tagihan tetap bulan ini</button></div></div>
<div class="card"><div class="row" style="margin:0;align-items:center"><h3 style="margin:0;flex:1">Ringkasan bulan</h3><input type="month" value="${em}" style="width:auto" onchange="em=this.value||em;render()"></div><div class="g" style="margin-top:10px"><div class="stat card" style="margin:0"><small>Uang diterima</small><b>${rp(inc)}</b></div><div class="stat card" style="margin:0"><small>Total pengeluaran</small><b>${rp(T)}</b></div><div class="stat card" style="margin:0"><small>Laba bersih</small><b>${rp(inc-T)}</b></div></div><p style="color:var(--mu);font-size:13px;margin:10px 0 0">${Object.keys(C).map(k=>k+' '+rp(C[k])).join(' · ')||'Belum ada pengeluaran di bulan ini.'}</p></div>
<div class="card"><div class="row" style="margin:0 0 8px;align-items:center"><h3 style="margin:0;flex:1">Daftar pengeluaran</h3><button onclick="expX()">Ekspor Excel</button></div><div class="ov"><table><tr><th>Tanggal</th><th>Kategori</th><th>Catatan</th><th class="r">Nominal</th><th></th></tr>${L.map(e=>`<tr><td>${fd(e.d)}</td><td>${e.cat}</td><td>${E(e.note)}</td><td class="r">${rp(e.amt)}</td><td><button class="red" onclick="delExp(${e.id})">Hapus</button></td></tr>`).join('')||'<tr><td colspan=5 style="color:var(--mu)">Belum ada data.</td></tr>'}</table></div></div>`}
function addExp(){const d=$('#e-d').value,a=+$('#e-a').value;if(!d||!(a>0)){toast('Isi tanggal dan nominal');return}S.exp.push({id:Date.now(),d,cat:$('#e-c').value,amt:a,note:$('#e-n').value.trim()});save();em=d.slice(0,7);render();toast('Pengeluaran disimpan')}
function delExp(id){S.exp=S.exp.filter(e=>e.id!==id);save();render()}
function fixExp(){let n=0;Object.keys(FIX).forEach(c=>{if(!S.exp.some(e=>e.cat===c&&e.d.slice(0,7)===em)){S.exp.push({id:Date.now()+n,d:em+'-01',cat:c,amt:FIX[c],note:'Tagihan tetap'});n++}});save();render();toast(n?n+' tagihan tetap ditambahkan':'Tagihan tetap bulan ini sudah ada')}
function expX(){const h=['Tanggal','Kategori','Nominal','Catatan'],r=S.exp.map(e=>[e.d,e.cat,e.amt,e.note||'']);try{navigator.clipboard.writeText([h,...r].map(a=>a.join('\t')).join('\n'))}catch(x){}toast('Pengeluaran disalin ke clipboard: tempel ke Excel')}
function tSet(){const c=S.cfg;return`<div class="card"><h3>Akses Owner</h3>${owner?'<p>Mode Owner aktif. <button onclick="owner=false;render()">Kunci</button></p>':`<div class="row" style="margin:0"><input id="pin" type="password" placeholder="PIN Owner (awal: 1234)" style="max-width:240px"><button class="pri" onclick="if($('#pin').value===S.cfg.pin){owner=true;render()}else toast('PIN salah')">Buka kunci</button></div><p style="color:var(--mu);font-size:13px">PIN ini hanya pengaman tampilan di perangkat ini. Login Owner/Admin sungguhan perlu Supabase Auth.</p>`}</div>
<div class="card"><h3>Diskon pembayaran 12 bulan</h3><div class="g"><div><label>Persentase diskon (%)</label><input type="number" min="0" max="100" value="${c.disc}" ${owner?'':'disabled'} onchange="S.cfg.disc=Math.min(100,Math.max(0,+this.value||0));save()"></div><div><label>Status diskon</label><select ${owner?'':'disabled'} onchange="S.cfg.on=this.value==='1';save()"><option value="1" ${c.on?'selected':''}>Aktif</option><option value="0" ${c.on?'':'selected'}>Nonaktif</option></select></div></div><p style="color:var(--mu);font-size:13px">Diskon hanya berlaku untuk durasi 12 bulan dan dihitung sekali dari subtotal. Invoice yang sudah dibuat tidak berubah.</p></div>
<div class="card"><h3>Rekening pembayaran</h3><input value="${E(c.bank)}" ${owner?'':'disabled'} onchange="S.cfg.bank=this.value;save()"><label style="margin-top:10px">Nomor WhatsApp Business</label><input value="${E(c.wa||BIZ)}" ${owner?'':'disabled'} onchange="S.cfg.wa=waNum(this.value);save()">${owner?`<h3 style="margin-top:14px">Ganti PIN</h3><input type="password" placeholder="PIN baru" onchange="if(this.value){S.cfg.pin=this.value;save();toast('PIN diganti')}">`:''}</div>
<div class="card"><h3>Ekspor</h3><button onclick="exp()">Ekspor Excel</button></div>`}
function exp(){const h=['No Invoice','Tanggal','Penyewa','WhatsApp','Kamar','Mulai','Berakhir','Durasi (bln)','Subtotal','Diskon','Biaya tambahan','Total','Dibayar','Sisa','Status'];
const r=S.inv.map(v=>[v.no,v.date,v.tenant,v.wa,v.room+' '+v.rname,v.start,v.end,v.months,v.sub,v.disc,v.extra,v.total,paid(v),v.total-paid(v),stat(v)]);
try{navigator.clipboard.writeText([h,...r].map(a=>a.join('\t')).join('\n'))}catch(e){}
try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+[h,...r].map(a=>a.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='invoice-haven-residence.csv';a.click()}catch(e){}
toast('Data disalin ke clipboard: tempel ke Excel. CSV juga dicoba diunduh.')}

function sigPad(){const c=$('#sg');if(!c)return;const x=c.getContext('2d');x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#2b2e2c';let d=0;c.hs=0;
const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
c.onpointerdown=e=>{e.preventDefault();d=1;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke();c.hs=1};
c.onpointermove=e=>{if(!d)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};
c.onpointerup=c.onpointercancel=()=>d=0}
const clrSig=()=>{const c=$('#sg');c.getContext('2d').clearRect(0,0,c.width,c.height);c.hs=0};
function saveSig(id){const c=$('#sg'),v=S.inv.find(x=>x.id===id);if(!c.hs){toast('Tanda tangan masih kosong');return}v.sig=c.toDataURL('image/png');v.sigAt=td();log(v,'Penyewa menandatangani invoice');save();show(id);toast('Tanda tangan tersimpan')}
function delSig(id){const v=S.inv.find(x=>x.id===id);delete v.sig;delete v.sigAt;log(v,'Tanda tangan dihapus');save();show(id)}
async function mkPDF(){if(!window.html2canvas||!window.jspdf)throw new Error('lib');const cv=await html2canvas($('#doc'),{scale:2,backgroundColor:'#ffffff',scrollX:0,scrollY:0}),p=new window.jspdf.jsPDF('p','mm','a4');let w=190,h=cv.height*w/cv.width;if(h>277){w=w*277/h;h=277}p.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',(210-w)/2,10,w,h);return p}
async function savePDF(id){const v=S.inv.find(x=>x.id===id);toast('Menyiapkan PDF…');try{const p=await mkPDF();p.save(v.no+'.pdf');toast('PDF diunduh');return true}catch(e){if(!(e&&e.code==='declined'))toast('Gagal membuat PDF. Coba tombol Cetak.');return false}}
async function sendPDF(id){const v=S.inv.find(x=>x.id===id),to=waNum(v.wa);toast('Menyiapkan PDF…');
try{const p=await mkPDF(),f=new File([p.output('blob')],v.no+'.pdf',{type:'application/pdf'});
if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:`Invoice ${v.no} Haven Residence – ${v.tenant}`});S.log.push({t:new Date().toLocaleString('id-ID'),no:v.no,ty:'PDF',to:to||'-'});save();return}}catch(e){if(e&&e.name==='AbortError')return}
const ok=await savePDF(id);sendWA(id,'inv');if(ok)toast('PDF tersimpan. Lampirkan file tersebut di chat WhatsApp yang terbuka.')}
document.querySelectorAll(".lg").forEach(i=>i.src=LOGO);
render();
</script></body></html>
